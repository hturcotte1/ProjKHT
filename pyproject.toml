[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kht"
version = "0.1.0"
description = "Project KHT: trading shifts in crowd perception on Polymarket"
requires-python = ">=3.11"
dependencies = [
    # the trading engine itself only needs an HTTP client
    "requests>=2.31",
]

[project.optional-dependencies]
research = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]
live = ["polymarket-client>=0.18"]
live-us = ["cryptography>=42"]
dev = ["pytest>=8"]

[project.scripts]
kht = "kht.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
