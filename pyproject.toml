[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kht"
version = "0.1.0"
description = "Project KHT: trading shifts in crowd perception on Polymarket"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "scikit-learn>=1.4"]

[project.scripts]
kht = "kht.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
