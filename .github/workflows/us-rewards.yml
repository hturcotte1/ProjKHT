# Follows Polymarket US games through the six hours before they start and
# works out what small resting orders would have been paid by the exchange's
# published reward formula, and how often they would have been traded
# against (docs/09_sports_rewards.md).
# Beside that it carries two recorders of crypto order books for two other
# paper tests (docs/11_crypto_us.md, sections 5 and 12).
# A simulation: it reads public market data only. No credentials, no orders.
#
# One run lasts about five hours and then starts the next, so that games are
# followed without gaps. What it has recorded is pushed once an hour, so a
# machine that is lost costs an hour at most, and a second job below then
# starts the next run at once. It stops by itself on 18 November 2026.
# To stop it sooner: add an empty file state/us-rewards/STOP, or
# Actions tab -> "us-rewards" -> "..." -> "Disable workflow" (and the same
# for "us-rewards-watchdog", which restarts it).
name: us-rewards

on:
  workflow_dispatch:
  schedule:
    # A safety net only. If a run ends without starting its successor, this
    # starts one within a few hours. While a run is going, it just waits.
    - cron: "41 */2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: us-rewards
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is when the job starts, not as it was when the
          # run was queued: other runs commit state in the meantime.
          ref: ${{ github.ref }}
      - name: Still wanted?
        id: gate
        run: |
          if [ -f state/us-rewards/STOP ]; then
            echo "stopped by the file state/us-rewards/STOP" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%Y%m%d)" -ge 20261118 ]; then
            echo "past the end date of the test" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Install (engine only, no research stack)
        if: steps.gate.outputs.go == 'true'
        run: pip install -e .
      - name: Follow the games before they start (read-only)
        id: record
        if: steps.gate.outputs.go == 'true'
        timeout-minutes: 320
        run: |
          # A run lasts five hours. If that would end it between 21:35 and
          # 22:03 UTC, it ends at 21:33 instead: the daily crypto markets
          # settle at 22:00 and the third program below has to see their
          # last quarter of an hour whole.
          now=$(date -u +%s); mins=300
          day=$((now - now % 86400))
          for d in 0 86400; do
            from=$((day + d + 77700)); to=$((day + d + 79380))
            end=$((now + mins * 60))
            if [ "$end" -ge "$from" ] && [ "$end" -le "$to" ]; then mins=$(( (from - 120 - now) / 60 )); fi
          done
          echo "this run: $mins minutes"
          # Push what has been recorded once an hour, and a few minutes after
          # the daily crypto settlement at 22:00 UTC. The programs below are
          # not touched by it: it works in a second checkout.
          (
            last=$(date -u +%s)
            while sleep 60; do
              t=$(date -u +%s); hm=$((10#$(date -u +%H%M)))
              if [ $((t - last)) -ge 3600 ] || { [ "$hm" -ge 2203 ] && [ "$hm" -le 2212 ] && [ $((t - last)) -ge 900 ]; }; then
                bash scripts/ci_save_state.sh "Paper orders before games: so far, $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || true
                last=$(date -u +%s)
              fi
            done
          ) &
          saver=$!
          # Alongside the judged test: the order-placing system itself, on
          # paper and under its own limits (docs/10_us_quoter.md). It sends
          # nothing anywhere. If it fails, the judged test is not affected.
          (timeout $((mins + 2))m kht us-quote --config config/us_quoter.json --state state/us-quoter --minutes $((mins - 2)) > us-quote.log 2>&1 || true) &
          # And a recorder for another test: crypto markets in their last
          # minutes (docs/11_crypto_us.md). Read-only as well, and as
          # harmless to the judged test if it fails.
          (timeout $((mins + 2))m kht us-lasttick --state state/us-lasttick --minutes $((mins - 2)) > us-lasttick.log 2>&1 || true) &
          # A second copy of that recorder, for the test of section 12 of
          # the same document: the brackets only, from five and a half hours
          # before they settle, every two minutes, into its own directory.
          (timeout $((mins + 2))m kht us-lasttick --state state/us-ladder --kinds range --follow 19800 --sweep 120 --budget 3 --minutes $((mins - 2)) > us-ladder.log 2>&1 || true) &
          # Their output is only shown when the run ends. Say now whether
          # each is up, so that a fault shows in the log the same evening.
          sleep 15
          for name in us-quote us-lasttick us-ladder; do
            if pgrep -f "state/$name" > /dev/null; then echo "$name is running"; else echo "$name is NOT running:"; cat "$name.log" || true; fi
          done
          kht us-rewards --state state/us-rewards --minutes "$mins"
          kill "$saver" 2>/dev/null || true
          wait
          tail -n 4 us-quote.log || true
          tail -n 2 us-lasttick.log || true
          tail -n 2 us-ladder.log || true
      - name: Commit what was recorded
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          bash scripts/ci_save_state.sh "Paper orders before games: run ending $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
      - name: Start the next run
        # Only after a run that worked. A run that failed must not start
        # another at once, or a fault would loop; the watchdog retries it.
        if: steps.gate.outputs.go == 'true' && steps.record.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run us-rewards.yml --ref "${GITHUB_REF_NAME}"

  # If the job above ended badly after it had been going for a while, its
  # machine was most likely lost (it happened on 11 November, twenty minutes
  # before the daily crypto settlement). This starts the next run at once,
  # from a fresh machine, without waiting for a schedule. A run that fails
  # within ten minutes is a fault and not a lost machine: that is left to the
  # schedule and the watchdog, so that a fault cannot restart itself in a loop.
  # A run that somebody cancelled is not restarted.
  restart:
    needs: record
    if: ${{ !cancelled() && needs.record.result != 'success' && needs.record.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the next run if this one was lost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -ge 20261118 ]; then
            echo "past the end date of the test"
            exit 0
          fi
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          age=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          echo "this run started at $started, $age seconds ago"
          if [ "$age" -lt 600 ]; then
            echo "it failed within ten minutes: a fault, left to the schedule"
            exit 0
          fi
          gh workflow run us-rewards.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
