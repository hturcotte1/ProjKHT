# Follows Polymarket US games through the six hours before they start and
# works out what small resting orders would have been paid by the exchange's
# published reward formula, and how often they would have been traded
# against (docs/09_sports_rewards.md).
# A simulation: it reads public market data only. No credentials, no orders.
#
# One run lasts about five hours and then starts the next, so that games are
# followed without gaps. It stops by itself on 18 November 2026.
# To stop it sooner: add an empty file state/us-rewards/STOP, or
# Actions tab -> "us-rewards" -> "..." -> "Disable workflow".
name: us-rewards

on:
  workflow_dispatch:
  schedule:
    # A safety net only. If a run ends without starting its successor, this
    # starts one within a few hours. While a run is going, it just waits.
    - cron: "41 */2 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: us-rewards
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is when the job starts, not as it was when the
          # run was queued: other runs commit state in the meantime.
          ref: ${{ github.ref }}
      - name: Still wanted?
        id: gate
        run: |
          if [ -f state/us-rewards/STOP ]; then
            echo "stopped by the file state/us-rewards/STOP" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%Y%m%d)" -ge 20261118 ]; then
            echo "past the end date of the test" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Install (engine only, no research stack)
        if: steps.gate.outputs.go == 'true'
        run: pip install -e .
      - name: Follow the games before they start (read-only)
        id: record
        if: steps.gate.outputs.go == 'true'
        timeout-minutes: 320
        run: |
          # A run lasts five hours. If that would end it between 21:35 and
          # 22:03 UTC, it ends at 21:33 instead: the daily crypto markets
          # settle at 22:00 and the third program below has to see their
          # last quarter of an hour whole.
          now=$(date -u +%s); mins=300
          day=$((now - now % 86400))
          for d in 0 86400; do
            from=$((day + d + 77700)); to=$((day + d + 79380))
            end=$((now + mins * 60))
            if [ "$end" -ge "$from" ] && [ "$end" -le "$to" ]; then mins=$(( (from - 120 - now) / 60 )); fi
          done
          echo "this run: $mins minutes"
          # Alongside the judged test: the order-placing system itself, on
          # paper and under its own limits (docs/10_us_quoter.md). It sends
          # nothing anywhere. If it fails, the judged test is not affected.
          (timeout $((mins + 2))m kht us-quote --config config/us_quoter.json --state state/us-quoter --minutes $((mins - 2)) > us-quote.log 2>&1 || true) &
          # And a recorder for another test: crypto markets in their last
          # minutes (docs/11_crypto_us.md). Read-only as well, and as
          # harmless to the judged test if it fails.
          (timeout $((mins + 2))m kht us-lasttick --state state/us-lasttick --minutes $((mins - 2)) > us-lasttick.log 2>&1 || true) &
          kht us-rewards --state state/us-rewards --minutes "$mins"
          wait
          tail -n 4 us-quote.log || true
          tail -n 2 us-lasttick.log || true
      - name: Commit what was recorded
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/us-rewards
          if [ -d state/us-quoter ]; then git add state/us-quoter; fi
          if [ -d state/us-lasttick ]; then git add state/us-lasttick; fi
          if git diff --cached --quiet; then
            echo "nothing recorded"
          else
            git commit -m "Paper orders before games: run ending $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3 4; do
              if git pull --rebase --autostash && git push; then break; fi
              sleep $((i * 10))
            done
          fi
      - name: Start the next run
        # Only after a run that worked. A run that failed must not start
        # another at once, or a fault would loop; the schedule retries it.
        if: steps.gate.outputs.go == 'true' && steps.record.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run us-rewards.yml --ref "${GITHUB_REF_NAME}"
