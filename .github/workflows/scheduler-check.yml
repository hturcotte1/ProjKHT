# Temporary. GitHub has not started a single scheduled run of the paper trader,
# and this finds out whether it starts anything on a schedule in this
# repository at all, or whether only that one workflow is stuck. It does
# nothing but say that it ran. Remove once the question is answered.
name: scheduler-check

on:
  schedule:
    - cron: "*/5 * * * *"

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "started by $EVENT at $(date -u +%FT%TZ)"
        env:
          EVENT: ${{ github.event_name }}
