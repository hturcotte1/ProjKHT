# Temporary. GitHub has not started a single scheduled run of the paper trader.
# This workflow has a schedule and nothing else, and its schedule was committed
# from a Claude session, like the paper trader's first ones. The paper trader's
# has since been committed again as the repository owner. Whichever of the two
# starts first says why neither ran (see "On a schedule" in docs/03_system.md).
# It does nothing but say that it ran. Delete it once that question is settled.
name: scheduler-check

on:
  schedule:
    - cron: "31 * * * *"

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "started by $EVENT at $(date -u +%FT%TZ)"
        env:
          EVENT: ${{ github.event_name }}
