# A one-off check of the restart job in us-rewards.yml: does a job that
# failed set off the job after it, and can that job read when the run
# started? It starts nothing and records nothing. Run once by hand, then
# removed again.
name: restart-selftest

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on purpose
        run: |
          echo "failing on purpose"
          exit 1

  restart:
    needs: record
    if: ${{ !cancelled() && needs.record.result != 'success' && needs.record.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: What the restart job would do
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "the job before this one ended as: ${{ needs.record.result }}"
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          age=$(( $(date -u +%s) - $(date -u -d "$started" +%s) ))
          echo "this run started at $started, $age seconds ago"
          if [ "$age" -lt 600 ]; then
            echo "it failed within ten minutes: a fault, left to the schedule"
          else
            echo "it would start the next run now"
          fi
          gh workflow view us-rewards.yml --repo "${GITHUB_REPOSITORY}" > /dev/null && echo "the workflow to start can be seen with this token"
